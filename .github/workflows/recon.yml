name: Recon (temporary)

on:
  push:
    paths:
      - 'recon-request/recon.sh'
      - 'recon-request/go.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run recon script
        run: bash recon-request/recon.sh > recon-request/output.txt 2>&1 || true
      - name: Publish recon output
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A recon-request
          if git diff --cached --quiet; then
            echo 'recon output unchanged'
          else
            git commit -m 'chore(recon): output [skip ci]'
            git push
          fi
