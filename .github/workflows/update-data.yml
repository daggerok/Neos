name: Update NEOS ETF data

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:
    inputs:
      max_fetches:
        description: "Batch size; continues after the saved ticker cursor; empty or 0 means a full pass over every catalog fund; blank inherits scripts/update-data.config.json"
        required: false
        default: ""
        type: string
      request_sleep:
        description: "Seconds between outgoing request starts; keep requests polite to neosfunds.com and Yahoo; blank inherits scripts/update-data.config.json"
        required: false
        default: ""
        type: string
      aum:
        description: "AUM min:max; bounds may be amounts or K/M/B/T suffixes, or nano/micro/small/mid/large; blank inherits scripts/update-data.config.json"
        required: false
        default: ""
        type: string
      ter:
        description: "Expense ratio range in percent: min:max; blank inherits scripts/update-data.config.json"
        required: false
        default: ""
        type: string
      concurrency:
        description: "Parallel fund workers (keep low; neosfunds.com rate-limits bursts); blank inherits scripts/update-data.config.json"
        required: false
        default: ""
        type: string
      holdings_page_size:
        description: "Rows in each generated holdings JSON page; blank inherits scripts/update-data.config.json"
        required: false
        default: ""
        type: string
      history_page_size:
        description: "Rows in each generated history JSON page; blank inherits scripts/update-data.config.json"
        required: false
        default: ""
        type: string
      store_raw_downloads:
        description: "Store the official holdings CSV and fund pages under api/neos/raw; blank inherits scripts/update-data.config.json"
        required: false
        default: ""
        type: string
      max_retries:
        description: "Retries after the initial request (408/425/429/5xx); blank inherits scripts/update-data.config.json"
        required: false
        default: ""
        type: string
      tickers:
        description: "Only update these tickers, separated by spaces or commas; blank inherits scripts/update-data.config.json"
        required: false
        default: ""
        type: string
      category:
        description: "Only funds whose NEOS asset class contains this text; blank inherits scripts/update-data.config.json"
        required: false
        default: ""
        type: string
      dividend_yield:
        description: "Catalog distribution-rate percentage range; colon required; blank inherits scripts/update-data.config.json"
        required: false
        default: ""
        type: string
      sec_yield:
        description: "Catalog 30-day SEC yield percentage range; colon required; blank inherits scripts/update-data.config.json"
        required: false
        default: ""
        type: string
      history_range:
        description: "Yahoo chart range used for history/distribution rows (max, 10y, 5y, ...); blank inherits scripts/update-data.config.json"
        required: false
        default: ""
        type: string
      edgar_fallback:
        description: "Fall back to SEC EDGAR Form N-PORT-P (NEOS ETF Trust, CIK 0001848758) when a holdings download is unavailable; blank inherits scripts/update-data.config.json"
        required: false
        default: ""
        type: string
      skip_yahoo:
        description: "Keep previous history and distributions while refreshing catalog/holdings; blank inherits scripts/update-data.config.json"
        required: false
        default: ""
        type: string
      skip_neos:
        description: "Keep the previously published official catalog; blank inherits scripts/update-data.config.json"
        required: false
        default: ""
        type: string
      sec_ua:
        description: "SEC User-Agent contact string (EDGAR requires a declared identity); blank inherits scripts/update-data.config.json"
        required: false
        default: ""
        type: string
      advanced:
        description: 'JSON object of supported control overrides not exposed above (keys are UPPER_CASE control names, values are scalars); nonblank individual inputs win'
        required: false
        default: '{}'
        type: string

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run updater unit tests
        run: bun test
      - name: Resolve file defaults and manual overrides
        env:
          DISPATCH_INPUTS: ${{ toJSON(inputs) }}
          PROTECTED_SEC_UA: ${{ vars.SEC_UA }}
        run: |
          bun --eval '
            import { resolveControls } from "./scripts/update-data.ts";
            import { appendFile } from "node:fs/promises";
            // schedule runs have no dispatch inputs: file defaults apply as-is
            const inputs = JSON.parse(process.env.DISPATCH_INPUTS || "{}") || {};
            const advanced = JSON.parse(inputs.advanced || "{}");
            const individual = Object.fromEntries(Object.entries(inputs)
              .filter(([key]) => key !== "advanced")
              .map(([key, value]) => [key.toUpperCase(), value]));
            const file = await Bun.file("scripts/update-data.config.json").json();
            // Protected repository Actions variables: highest precedence, applied only when nonblank (never printed).
            const protectedVars = {};
            if ((process.env.PROTECTED_SEC_UA ?? "").trim()) protectedVars.SEC_UA = process.env.PROTECTED_SEC_UA.trim();
            const controls = resolveControls(file, advanced, individual, protectedVars);
            await appendFile(process.env.GITHUB_ENV,
              Object.entries(controls).map(([key, value]) => `${key}=${value}\n`).join(""));
          '
      - name: Generate api/neos static data
        run: bun ./scripts/update-data.ts
      - name: Commit updated data
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git add api/neos
          if git diff --cached --quiet -- api/neos; then
            echo "api/neos is already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(data): update NEOS ETF data"
          # Runtime-only auth; no token/header stored in URL, file or Git config.
          push() { git -c credential.helper= -c credential.helper='!f() { if test "$1" = get; then printf "username=x-access-token\npassword=%s\n" "$GITHUB_TOKEN"; fi; }; f' push; }
          # main may have moved while the updater ran (merges, other pushes): rebase the data commit and retry
          for attempt in 1 2 3 4; do
            push && exit 0
            echo "push rejected: rebasing onto origin/${GITHUB_REF_NAME} (attempt ${attempt})"
            git pull --rebase origin "${GITHUB_REF_NAME}" || exit 1
          done
          exit 1
